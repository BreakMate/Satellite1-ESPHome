globals:
  ##############################################################################################
  # RAINBOW EFFECT TUNABLES
  # Every value in this block is also exposed as a Home Assistant number entity on the device
  # page (grouped with "Rainbow Speed" further down), so these can be adjusted live without
  # reflashing. The values here are just the defaults used on first boot / after a factory
  # reset — after that, each entity's own restored value takes over.
  ##############################################################################################
  # Degrees of hue shift per frame for the Rainbow effect while idle. Adjustable live via the
  # "Rainbow Speed" number entity.
  - id: rainbow_speed
    type: float
    restore_value: yes
    initial_value: '2.0'
  # Gamma correction exponent for the Rainbow effect's color math. 1.0 = no correction (raw
  # colors); higher values boost blended hues (orange, cyan, purple, etc.) so they don't look
  # washed out next to pure red/green/blue. Try 1.0-3.0. "Rainbow Gamma" number entity.
  - id: rainbow_gamma
    type: float
    restore_value: yes
    initial_value: '1.1'
  # How long the wake-word "rainbow wipes on around the ring" reveal animation takes, in
  # milliseconds. "Rainbow Wake Reveal (ms)" number entity.
  - id: wake_reveal_duration_ms
    type: float
    restore_value: yes
    initial_value: '250'
  # Multiplier applied to Rainbow Speed while listening (spins in the opposite direction).
  # "Rainbow Reverse Speed x" number entity.
  - id: rainbow_reverse_multiplier
    type: float
    restore_value: yes
    initial_value: '2.0'
  # Multiplier applied to Rainbow Speed while thinking/processing (spins forward, faster).
  # "Rainbow Thinking Speed x" number entity.
  - id: rainbow_thinking_multiplier
    type: float
    restore_value: yes
    initial_value: '4.0'
  ##############################################################################################

  # Global index for our LEDs. So that switching between different animation does not lead to unwanted effects.
  - id: global_led_animation_index
    type: int
    restore_value: no
    initial_value: '0'
  - id: led_anim_speed
    type: float
    restore_value: no
    initial_value: '0.5'
  # Current phase (0-360 degrees) of the Rainbow effect. Kept as a global rather than a local
  # static variable so other effects (e.g. the volume bar) can read the same live rotation
  # instead of drifting out of sync with their own separate counters.
  - id: rainbow_hue
    type: float
    restore_value: no
    initial_value: '0.0'
  # Tracks whether the wake-word "rainbow turning on in a circle" reveal is currently playing,
  # and when it started (for the elapsed-time calculation).
  - id: wake_reveal_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: wake_reveal_start_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # Remembers that the user's chosen ambient effect is Rainbow, even while led_ring is turned
  # off. ESPHome resets a light's "effect" to None whenever it's turned off, so
  # get_effect_name() alone can't tell us this once the ring is off — this global is the
  # persistent source of truth instead. Survives reboots (restore_value: yes) since it reflects
  # a preference, not a transient animation state.
  - id: rainbow_selected
    type: bool
    restore_value: yes
    initial_value: 'false'
  # True while led_ring has been temporarily turned on to show a voice-assistant interaction
  # even though the user had it switched off. Used to turn it back off afterward instead of
  # leaving it on.
  - id: rainbow_temporarily_on
    type: bool
    restore_value: no
    initial_value: 'false'
light:
  # Hardware LED ring. Not used because remapping needed
  - platform: esp32_rmt_led_strip
    id: hw_led_ring
    pin: GPIO21
    num_leds: 24
    channel_colors: GRB
    chipset: WS2812

  # User facing LED ring. Remapping of the hardware LEDs.
  # Exposed to be used by the user.
  - platform: partition
    id: led_ring
    name: LED Ring
    entity_category: config
    icon: "mdi:dots-circle"
    default_transition_length: 0ms
    restore_mode: RESTORE_DEFAULT_OFF
    initial_state:
      color_mode: rgb
      brightness: 66%
      red: 9.4%
      green: 73.3%
      blue: 94.9%
    segments:
      - id: hw_led_ring
        from: 0
        to: 23
    # Whenever the light turns on — from anywhere: Home Assistant, a physical control, an
    # automation, not just our own scripts — re-select Rainbow if that's the user's
    # remembered preference. Necessary because ESPHome resets a light's effect to None as
    # part of turning off (a known upstream behavior, see esphome/esphome#12372), so without
    # this, Rainbow would silently fall back to a static color every time the ring is toggled.
    # on_turn_on always fires before on_state for the same event (registration order is fixed
    # by codegen), and this call completes synchronously, so on_state below always sees the
    # correctly-restored effect rather than the transient "None".
    on_turn_on:
      - if:
          condition:
            lambda: 'return id(rainbow_selected) && id(led_ring).get_effect_name() != "Rainbow";'
          then:
            - light.turn_on:
                id: led_ring
                effect: "Rainbow"
    # Whenever the light is genuinely on, remember whether Rainbow is the active effect into
    # a persistent global — see rainbow_selected above for why this can't just be read live
    # from get_effect_name() later. Skipped while turning off, since ESPHome resets the
    # effect to None as part of that transition and we don't want that to erase our memory.
    on_state:
      - lambda: |-
          if (id(led_ring).current_values.get_state()) {
            id(rainbow_selected) = (id(led_ring).get_effect_name() == "Rainbow");
          }
    effects:
      - addressable_lambda:
          name: "Rainbow"
          update_interval: 16ms
          lambda: |-
            auto hsv_to_rgb = [](float h, float s, float v) -> Color {
              float r, g, b;
              int i = int(h / 60.0f) % 6;
              float f = (h / 60.0f) - i;
              float p = v * (1.0f - s);
              float q = v * (1.0f - f * s);
              float t = v * (1.0f - (1.0f - f) * s);
              switch (i) {
                case 0: r = v; g = t; b = p; break;
                case 1: r = q; g = v; b = p; break;
                case 2: r = p; g = v; b = t; break;
                case 3: r = p; g = q; b = v; break;
                case 4: r = t; g = p; b = v; break;
                default: r = v; g = p; b = q; break;
              }
              // Gamma correction: without this, blended hues (orange, cyan, purple, etc.)
              // look visually dimmer/washed out next to pure red/green/blue, since a single
              // LED channel at full power reads as "brighter" to the eye than two channels
              // blended at partial power. Raising GAMMA boosts the low/mid channel values
              // that make up blended colors, making them pop as much as the primaries.
              // Controlled live via the "Rainbow Gamma" number entity (try 1.0-3.0; 1.0
              // disables the effect entirely).
              const float GAMMA = id(rainbow_gamma);
              r = powf(r, 1.0f / GAMMA);
              g = powf(g, 1.0f / GAMMA);
              b = powf(b, 1.0f / GAMMA);
              return Color(uint8_t(r * 255), uint8_t(g * 255), uint8_t(b * 255));
            };

            auto rainbow_pixel = [&](int i) -> Color {
              float pixel_hue = id(rainbow_hue) + i * (360.0f / 24.0f);
              while (pixel_hue >= 360.0f) pixel_hue -= 360.0f;
              return hsv_to_rgb(pixel_hue, 1.0f, 1.0f);
            };

            // Mute/silenced markers use the color opposite whatever the rainbow would show at
            // that LED right now (180 degrees around the color wheel), so they always contrast
            // against their neighbors instead of blending in when the rainbow happens to be
            // red/orange at that position.
            auto contrast_pixel = [&](int i) -> Color {
              float pixel_hue = id(rainbow_hue) + i * (360.0f / 24.0f) + 180.0f;
              while (pixel_hue >= 360.0f) pixel_hue -= 360.0f;
              return hsv_to_rgb(pixel_hue, 1.0f, 1.0f);
            };

            if (id(btn_action).state || id(jack_plugged_recently) || id(jack_unplugged_recently) ||
                id(warning) || id(timer_ringing).state ||
                id(voice_assistant_phase) == ${voice_assist_not_ready_phase_id} ||
                id(voice_assistant_phase) == ${voice_assist_error_phase_id}) {
              // Another effect (Action Button, Jack Plugged/Unplugged, Warning, Timer Ringing,
              // or the voice assistant's brief Not Ready/Error states) owns the physical LEDs
              // right now. Suspend Rainbow entirely by not writing any pixels, WITHOUT touching
              // led_ring's on/off state or effect selection — turning a light off resets its
              // selected effect in ESPHome, which is what previously caused Rainbow to get
              // replaced by a static color after one of these was triggered. The voice assistant
              // briefly passes through Not Ready as part of its normal pipeline reset right after
              // a response finishes, which is what caused the flicker right after TTS ends.
              return;
            }

            if (id(volume_buttons_touched)) {
              // Volume display: only light the LEDs proportional to the current volume,
              // using the rainbow instead of a flat color. e.g. 50% volume -> 12 LEDs lit.
              auto volume = id(external_media_player).volume;
              int lit_count = int(24.0f * volume + 0.5f);
              if (lit_count > 24) lit_count = 24;
              if (lit_count < 0) lit_count = 0;
              for (int i = 0; i < 24; i++) {
                it[i] = (i < lit_count) ? rainbow_pixel(i) : Color::BLACK;
              }
              if (volume == 0.0f) {
                it[0] = contrast_pixel(0);
              }
            } else if (id(is_timer_active)) {
              // Timer countdown: same fading-edge behavior as the solid-color "Timer Tick"
              // effect, just tinting each lit LED with its live rainbow color instead of a
              // flat color.
              auto timer_ratio = 24.0f * id(first_active_timer).seconds_left / max(id(first_active_timer).total_seconds, static_cast<uint32_t>(1));
              for (int i = 0; i < 24; i++) {
                if (i <= timer_ratio) {
                  float factor = min(timer_ratio - i, 1.0f);
                  if (factor < 0.0f) factor = 0.0f;
                  it[i] = rainbow_pixel(i) * min(255.0f * factor, 255.0f);
                } else {
                  it[i] = Color::BLACK;
                }
              }
              // Same mute marker positions as the solid-color "Timer Tick" effect, just without
              // the black buffer LEDs on either side.
              if (id(master_mute_switch).state) {
                it[3] = contrast_pixel(3);
                it[9] = contrast_pixel(9);
              }
            } else if (id(wake_reveal_active)) {
              // Wake word acknowledgment: the rainbow wipes on around the ring over 250ms,
              // starting from all LEDs off.
              uint32_t elapsed = millis() - id(wake_reveal_start_ms);
              if (elapsed >= (uint32_t) id(wake_reveal_duration_ms)) {
                id(wake_reveal_active) = false;
                for (int i = 0; i < 24; i++) {
                  it[i] = rainbow_pixel(i);
                }
              } else {
                float lit_f = (elapsed / id(wake_reveal_duration_ms)) * 24.0f;
                int lit_count = int(lit_f);
                float partial = lit_f - lit_count;
                for (int i = 0; i < 24; i++) {
                  if (i < lit_count) {
                    it[i] = rainbow_pixel(i);
                  } else if (i == lit_count) {
                    it[i] = rainbow_pixel(i) * min(255.0f * partial, 255.0f);
                  } else {
                    it[i] = Color::BLACK;
                  }
                }
              }
            } else {
              for (int i = 0; i < 24; i++) {
                it[i] = rainbow_pixel(i);
              }

              // Mute indicators drawn on top of the rainbow, using the contrasting color so
              // they stand out clearly no matter what the rainbow is doing at that LED. Each
              // corner gets a 3-LED cluster centered on the mic position (12 LEDs total).
              if (id(master_mute_switch).state) {
                const int mic_centers[] = {0, 6, 12, 18};
                for (int n = 0; n < 4; n++) {
                  int c = mic_centers[n];
                  it[(c + 23) % 24] = contrast_pixel((c + 23) % 24);
                  it[c] = contrast_pixel(c);
                  it[(c + 1) % 24] = contrast_pixel((c + 1) % 24);
                }
              }
              if (id(external_media_player).volume == 0.0f || id(external_media_player).is_muted()) {
                const int quadrant_starts[] = {1, 7, 13, 19};
                for (int n = 0; n < 4; n++) {
                  int s = quadrant_starts[n];
                  it[(s + 1) % 24] = contrast_pixel((s + 1) % 24);
                  it[(s + 2) % 24] = contrast_pixel((s + 2) % 24);
                  it[(s + 3) % 24] = contrast_pixel((s + 3) % 24);
                }
              }
            }

            id(rainbow_hue) += id(rainbow_speed);
            while (id(rainbow_hue) >= 360.0f) id(rainbow_hue) -= 360.0f;
            while (id(rainbow_hue) < 0.0f) id(rainbow_hue) += 360.0f;

  # Voice Assistant LED ring. Remapping of the hardware LED.
  # This light is not exposed. The device controls it
  - platform: partition
    id: voice_assistant_leds
    internal: true
    default_transition_length: 0ms
    segments:
      - id: hw_led_ring
        from: 0
        to: 23
    effects:
      - addressable_lambda:
          name: "Rotating Blob"
          update_interval: 50ms
          lambda: |-
            static float pos = 0.0f;

            auto draw_blob = [&](float pos) {
              auto light_color = id(led_ring).current_values;
              Color base(
                  light_color.get_red() * 255,
                  light_color.get_green() * 255,
                  light_color.get_blue() * 255
              );

              auto add_blob = [&](float center) {
                int p = int(floorf(center)) % 24;
                if (p < 0) p += 24;
                it[p] = base;
                it[(p + 23) % 24] = base * 192; // ~75%
                it[(p + 22) % 24] = base * 128; // ~50%
              };

              it.all() = Color::BLACK;
              add_blob(pos);
              add_blob(pos + 12.0f);
            };

            draw_blob(pos);
            pos += id(led_anim_speed);
            while (pos >= 24.0f) pos -= 24.0f;
            while (pos < 0.0f) pos += 24.0f;

      - addressable_lambda:
          name: "Thinking"
          update_interval: 10ms
          lambda: |-
            static uint8_t brightness_step = 0;
            static bool brightness_decreasing = true;
            static uint8_t brightness_step_number = 10;
            if (initial_run) {
              brightness_step = 0;
              brightness_decreasing = true;
              it.all() = Color::BLACK;
            }
            auto light_color = id(led_ring).current_values;
            Color color(
                light_color.get_red() * 255,
                light_color.get_green() * 255,
                light_color.get_blue() * 255
            );
            uint8_t brightness = 255 / brightness_step_number*(brightness_step_number-brightness_step);
            int pos = 2;
            it[pos] =    color * brightness;
            it[pos+12] = color * brightness;

            if (brightness_decreasing) {
              brightness_step++;
            } else {
              brightness_step--;
            }
            if (brightness_step == 0 || brightness_step == brightness_step_number) {
              brightness_decreasing = !brightness_decreasing;
            }

      - addressable_lambda:
          name: "Muted or Silent"
          update_interval: 50ms
          lambda: |2-

            Color mic_muted_color(255, 0, 0);
            Color speaker_muted_color(200, 0, 0);
            auto light_color = id(led_ring).current_values;
            Color color(
                light_color.get_red() * 255,
                light_color.get_green() * 255,
                light_color.get_blue() * 255
            );
            bool light_on = light_color.get_state();
            for (int i = 0; i < 24; i++) {
              it[i] = light_on ? color : Color::BLACK;
            }
            auto mark_mic_positions = [&](const int centers[], int count) {
              for (int n = 0; n < count; n++) {
                int c = centers[n];
                it[(c + 23) % 24] = Color::BLACK;
                it[c] = mic_muted_color;
                it[(c + 1) % 24] = Color::BLACK;
              }
            };
            auto mark_quadrants = [&](const int starts[], int count) {
              for (int n = 0; n < count; n++) {
                int s = starts[n];
                it[s] = Color::BLACK;
                it[(s + 1) % 24] = speaker_muted_color;
                it[(s + 2) % 24] = speaker_muted_color;
                it[(s + 3) % 24] = speaker_muted_color;
                it[(s + 4) % 24] = Color::BLACK;
              }
            };
            if (id(master_mute_switch).state) {
              const int mic_centers[] = {0, 6, 12, 18};
              mark_mic_positions(mic_centers, 4);
            }

            if (id(external_media_player).volume == 0.0f || id(external_media_player).is_muted()) {
              const int quadrant_starts[] = {1, 7, 13, 19};
              mark_quadrants(quadrant_starts, 4);
            }

      - addressable_lambda:
          name: "Volume Display"
          update_interval: 50ms
          lambda: |-
            auto light_color = id(led_ring).current_values;
            Color color(light_color.get_red() * 255, light_color.get_green() * 255,
                  light_color.get_blue() * 255);
            Color silenced_color(255, 0, 0);
            auto volume_ratio = 24.0f * id(external_media_player).volume;
            for (int i = 0; i < 24; i++) {
              if (i <= volume_ratio) {
                it[(0+i)%24] = color * min( 255.0f * (volume_ratio - i) , 255.0f ) ;
              } else {
                it[(0+i)%24] = Color::BLACK;
              }
            }
            if (id(external_media_player).volume == 0.0f) {
              it[0] = silenced_color;
            }
      - addressable_lambda:
          name: "Action Button Touched"
          update_interval: 16ms
          lambda: |-
            if (id(rainbow_selected)) {
              auto hsv_to_rgb = [](float h) -> Color {
                float r, g, b;
                int i = int(h / 60.0f) % 6;
                float f = (h / 60.0f) - i;
                switch (i) {
                  case 0: r = 1; g = f; b = 0; break;
                  case 1: r = 1 - f; g = 1; b = 0; break;
                  case 2: r = 0; g = 1; b = f; break;
                  case 3: r = 0; g = 1 - f; b = 1; break;
                  case 4: r = f; g = 0; b = 1; break;
                  default: r = 1; g = 0; b = 1 - f; break;
                }
                const float GAMMA = id(rainbow_gamma);
                r = powf(r, 1.0f / GAMMA);
                g = powf(g, 1.0f / GAMMA);
                b = powf(b, 1.0f / GAMMA);
                return Color(uint8_t(r * 255), uint8_t(g * 255), uint8_t(b * 255));
              };
              for (int i = 0; i < 24; i++) {
                float pixel_hue = id(rainbow_hue) + i * (360.0f / 24.0f);
                while (pixel_hue >= 360.0f) pixel_hue -= 360.0f;
                it[i] = hsv_to_rgb(pixel_hue);
              }
              id(rainbow_hue) += id(rainbow_speed);
              while (id(rainbow_hue) >= 360.0f) id(rainbow_hue) -= 360.0f;
              while (id(rainbow_hue) < 0.0f) id(rainbow_hue) += 360.0f;
            } else {
              if (initial_run) {
                // set voice_assistant_leds light to colors based on led_ring
                auto led_ring_cv = id(led_ring).current_values;
                auto va_leds_call = id(voice_assistant_leds).make_call();
                va_leds_call.from_light_color_values(led_ring_cv);
                va_leds_call.set_brightness( min ( max( id(led_ring).current_values.get_brightness() , 0.2f ) + 0.1f , 1.0f ) );
                va_leds_call.set_state(true);
                va_leds_call.perform();
              }
              auto light_color = id(voice_assistant_leds).current_values;
              Color color(light_color.get_red() * 255, light_color.get_green() * 255,
                    light_color.get_blue() * 255);
              for (int i = 0; i < 24; i++) {
                it[i] = color;
              }
            }
      - addressable_twinkle:
          name: "Twinkle"
          twinkle_probability: 50%
      - addressable_lambda:
          name: "Error"
          update_interval: 10ms
          lambda: |-
            static uint8_t brightness_step = 0;
            static bool brightness_decreasing = true;
            static uint8_t brightness_step_number = 10;
            if (initial_run) {
              brightness_step = 0;
              brightness_decreasing = true;
            }
            Color error_color(255, 0, 0);
            for (int i = 0; i < 24; i++) {
              it[i] = error_color * uint8_t(255/brightness_step_number*(brightness_step_number-brightness_step));
            }
            if (brightness_decreasing) {
              brightness_step++;
            } else {
              brightness_step--;
            }
            if (brightness_step == 0 || brightness_step == brightness_step_number) {
              brightness_decreasing = !brightness_decreasing;
            }
      - addressable_lambda:
          name: "Success"
          update_interval: 10ms
          lambda: |-
            static uint8_t brightness_step = 0;
            static bool brightness_decreasing = true;
            static uint8_t brightness_step_number = 10;
            static uint8_t counter = 0;
            if (initial_run) {
              brightness_step = 0;
              brightness_decreasing = true;
              counter = 0;
            }
            Color error_color(0, 255, 0);
            for (int i = 0; i < 24; i++) {
              it[i] = error_color * uint8_t(255/brightness_step_number*(brightness_step_number-brightness_step));
            }
            if (brightness_decreasing) {
              brightness_step++;
            } else {
              brightness_step--;
            }
            if (brightness_step == 0 || brightness_step == brightness_step_number) {
              brightness_decreasing = !brightness_decreasing;
            }

      - addressable_lambda:
          name: "Warning"
          update_interval: 10ms
          lambda: |-
            static uint8_t brightness_step = 0;
            static bool brightness_decreasing = true;
            static uint8_t brightness_step_number = 10;
            static uint8_t blink_count = 0;  // New counter for blink cycles
            if (initial_run) {
              brightness_step = 0;
              brightness_decreasing = true;
              blink_count = 0;
            }
            Color error_color(255, 0, 0);
            if (blink_count < 5) {  // Only blink 5 times
              for (int i = 0; i < 24; i++) {
                it[i] = error_color * uint8_t(255/brightness_step_number*(brightness_step_number-brightness_step));
              }
              if (brightness_decreasing) {
                brightness_step++;
              } else {
                brightness_step--;
              }
              if (brightness_step == 0 || brightness_step == brightness_step_number) {
                brightness_decreasing = !brightness_decreasing;
                if (brightness_step == 0) {  // Completed one blink cycle
                  blink_count++;
                }
              }
            } else {
              // Turn off LEDs after 5 blinks
              for (int i = 0; i < 24; i++) {
                it[i] = Color(0, 0, 0);
              }
            }
      - pulse:
          name: "Fast Pulse"
          transition_length: 100ms
          update_interval: 100ms
          min_brightness: 50%
          max_brightness: 100%

      - addressable_lambda:
          name: "Timer Ring"
          update_interval: 10ms
          lambda: |-
            static uint8_t brightness_step = 0;
            static bool brightness_decreasing = true;
            static uint8_t brightness_step_number = 10;
            if (initial_run) {
              brightness_step = 0;
              brightness_decreasing = true;
            }
            bool use_rainbow = id(rainbow_selected);
            auto hsv_to_rgb = [](float h) -> Color {
              float r, g, b;
              int i = int(h / 60.0f) % 6;
              float f = (h / 60.0f) - i;
              switch (i) {
                case 0: r = 1; g = f; b = 0; break;
                case 1: r = 1 - f; g = 1; b = 0; break;
                case 2: r = 0; g = 1; b = f; break;
                case 3: r = 0; g = 1 - f; b = 1; break;
                case 4: r = f; g = 0; b = 1; break;
                default: r = 1; g = 0; b = 1 - f; break;
              }
              const float GAMMA = id(rainbow_gamma);
              r = powf(r, 1.0f / GAMMA);
              g = powf(g, 1.0f / GAMMA);
              b = powf(b, 1.0f / GAMMA);
              return Color(uint8_t(r * 255), uint8_t(g * 255), uint8_t(b * 255));
            };
            auto light_color = id(led_ring).current_values;
            Color color(light_color.get_red() * 255, light_color.get_green() * 255,
                  light_color.get_blue() * 255);
            Color muted_color(255, 0, 0);
            uint8_t brightness_scale = uint8_t(255/brightness_step_number*(brightness_step_number-brightness_step));
            for (int i = 0; i < 24; i++) {
              if (use_rainbow) {
                float pixel_hue = id(rainbow_hue) + i * (360.0f / 24.0f);
                while (pixel_hue >= 360.0f) pixel_hue -= 360.0f;
                it[i] = hsv_to_rgb(pixel_hue) * brightness_scale;
              } else {
                it[i] = color * brightness_scale;
              }
            }
            if (use_rainbow) {
              id(rainbow_hue) += id(rainbow_speed);
              while (id(rainbow_hue) >= 360.0f) id(rainbow_hue) -= 360.0f;
              while (id(rainbow_hue) < 0.0f) id(rainbow_hue) += 360.0f;
            }
            if ( id(master_mute_switch).state ) {
              it[3] = muted_color;
              it[9] = muted_color;
            }
            if (brightness_decreasing) {
              brightness_step++;
            } else {
              brightness_step--;
            }
            if (brightness_step == 0 || brightness_step == brightness_step_number) {
              brightness_decreasing = !brightness_decreasing;
            }
      - addressable_lambda:
          name: "Timer Tick"
          update_interval: 100ms
          lambda: |-
            auto light_color = id(led_ring).current_values;
            Color color(light_color.get_red() * 255, light_color.get_green() * 255,
                  light_color.get_blue() * 255);
            Color muted_color(255, 0, 0);
            auto timer_ratio = 24.0f * id(first_active_timer).seconds_left / max(id(first_active_timer).total_seconds , static_cast<uint32_t>(1));
            uint8_t last_led_on = static_cast<uint8_t>(ceil(timer_ratio)) - 1;
            for (int i = 0; i < 24; i++) {
              float brightness_dip = ( i == id(global_led_animation_index) % 24 && i != last_led_on ) ? 0.9f : 1.0f ;
              if (i <= timer_ratio) {
                it[i] = color * min (255.0f * brightness_dip * (timer_ratio - i) , 255.0f * brightness_dip) ;
              } else {
                it[i] = Color::BLACK;
              }
            }
            if (id(master_mute_switch).state) {
              it[2] = Color::BLACK;
              it[3] = muted_color;
              it[4] = Color::BLACK;
              it[8] = Color::BLACK;
              it[9] = muted_color;
              it[10] = Color::BLACK;
            }
            id(global_led_animation_index) = (24 + id(global_led_animation_index) - 1) % 24;
      - addressable_rainbow:
          name: "Rainbow"
          width: 24
      - addressable_lambda:
          name: "Tick"
          update_interval: 333ms
          lambda: |-
            static uint8_t index = 0;
            Color color(255, 0, 0);
            if (initial_run) {
              index = 0;
            }
            for (int i = 0; i < 24; i++) {
              if (i <= index ) {
                it[i] = Color::BLACK;
              } else {
                it[i] = color;
              }
            }
            index = (index + 1) % 24;
      - addressable_lambda:
          name: "Flashing XMOS"
          update_interval: 333ms
          lambda: |-
            static uint8_t index = 0;
            Color color(0, 0, 255);
            if (initial_run) {
              index = 0;
            }
            for (int i = 0; i < 24; i++) {
              if (i <= index ) {
                it[i] = Color::BLACK;
              } else {
                it[i] = color;
              }
            }
            index = id(global_led_animation_index) % 24;
      - addressable_lambda:
          name: "Factory Reset Coming Up"
          update_interval: 500ms
          lambda: |-
            static uint8_t index = 0;
            Color color(255, 0, 0);
            if (initial_run) {
              index = 0;
            }
            for (int i = 0; i < 24; i++) {
              if (i <= index ) {
                it[i] = color;
              } else {
                it[i] = Color::BLACK;
              }
            }
            index = (index + 1) % 24;
      - addressable_lambda:
          name: "Jack Plugged"
          update_interval: 40ms
          lambda: |-
            static uint8_t index = 0;
            if (initial_run) {
              index = 0;
            }
            bool use_rainbow = id(rainbow_selected);
            auto hsv_to_rgb = [](float h) -> Color {
              float r, g, b;
              int i = int(h / 60.0f) % 6;
              float f = (h / 60.0f) - i;
              switch (i) {
                case 0: r = 1; g = f; b = 0; break;
                case 1: r = 1 - f; g = 1; b = 0; break;
                case 2: r = 0; g = 1; b = f; break;
                case 3: r = 0; g = 1 - f; b = 1; break;
                case 4: r = f; g = 0; b = 1; break;
                default: r = 1; g = 0; b = 1 - f; break;
              }
              const float GAMMA = id(rainbow_gamma);
              r = powf(r, 1.0f / GAMMA);
              g = powf(g, 1.0f / GAMMA);
              b = powf(b, 1.0f / GAMMA);
              return Color(uint8_t(r * 255), uint8_t(g * 255), uint8_t(b * 255));
            };
            auto rainbow_pixel = [&](int i) -> Color {
              float pixel_hue = id(rainbow_hue) + i * (360.0f / 24.0f);
              while (pixel_hue >= 360.0f) pixel_hue -= 360.0f;
              return hsv_to_rgb(pixel_hue);
            };
            auto light_color = id(led_ring).current_values;
            Color color(light_color.get_red() * 255, light_color.get_green() * 255,
                  light_color.get_blue() * 255);
            if (index <= 12) {
              for (int i = 0; i < 24; i++) {
                if (i == index) {
                  it[i] = use_rainbow ? rainbow_pixel(i) : color;
                } else if (i == (24 - index) % 24) {
                  it[i] = use_rainbow ? rainbow_pixel(i) : color;
                } else {
                  it[i] = Color::BLACK;
                }
              }
            }
            if (use_rainbow) {
              id(rainbow_hue) += id(rainbow_speed);
              while (id(rainbow_hue) >= 360.0f) id(rainbow_hue) -= 360.0f;
              while (id(rainbow_hue) < 0.0f) id(rainbow_hue) += 360.0f;
            }
            index = (index + 1);
      - addressable_lambda:
          name: "Jack Unplugged"
          update_interval: 40ms
          lambda: |-
            static uint8_t index = 0;
            if (initial_run) {
              index = 0;
            }
            bool use_rainbow = id(rainbow_selected);
            auto hsv_to_rgb = [](float h) -> Color {
              float r, g, b;
              int i = int(h / 60.0f) % 6;
              float f = (h / 60.0f) - i;
              switch (i) {
                case 0: r = 1; g = f; b = 0; break;
                case 1: r = 1 - f; g = 1; b = 0; break;
                case 2: r = 0; g = 1; b = f; break;
                case 3: r = 0; g = 1 - f; b = 1; break;
                case 4: r = f; g = 0; b = 1; break;
                default: r = 1; g = 0; b = 1 - f; break;
              }
              const float GAMMA = id(rainbow_gamma);
              r = powf(r, 1.0f / GAMMA);
              g = powf(g, 1.0f / GAMMA);
              b = powf(b, 1.0f / GAMMA);
              return Color(uint8_t(r * 255), uint8_t(g * 255), uint8_t(b * 255));
            };
            auto rainbow_pixel = [&](int i) -> Color {
              float pixel_hue = id(rainbow_hue) + i * (360.0f / 24.0f);
              while (pixel_hue >= 360.0f) pixel_hue -= 360.0f;
              return hsv_to_rgb(pixel_hue);
            };
            auto light_color = id(led_ring).current_values;
            Color color(light_color.get_red() * 255, light_color.get_green() * 255,
                  light_color.get_blue() * 255);
            if (index <= 12) {
              for (int i = 0; i < 24; i++) {
                if (i == 12 - index) {
                  it[i] = use_rainbow ? rainbow_pixel(i) : color;
                } else if (i == (12 + index) % 24) {
                  it[i] = use_rainbow ? rainbow_pixel(i) : color;
                } else {
                  it[i] = Color::BLACK;
                }
              }
            }
            if (use_rainbow) {
              id(rainbow_hue) += id(rainbow_speed);
              while (id(rainbow_hue) >= 360.0f) id(rainbow_hue) -= 360.0f;
              while (id(rainbow_hue) < 0.0f) id(rainbow_hue) += 360.0f;
            }
            index = (index + 1);

number:
  # Live speed control for the "Rainbow" light effect. No reflash needed to change it.
  - platform: template
    name: "Rainbow Speed"
    id: rainbow_speed_number
    icon: "mdi:speedometer"
    entity_category: config
    min_value: 0.0
    max_value: 10.0
    step: 0.5
    initial_value: 2.0
    optimistic: true
    restore_value: true
    set_action:
      - lambda: id(rainbow_speed) = x;

  # Gamma correction for the Rainbow effect's colors. 1.0 = off/raw colors; higher values make
  # blended hues (orange, cyan, purple, etc.) pop as much as pure red/green/blue.
  - platform: template
    name: "Rainbow Gamma"
    id: rainbow_gamma_number
    icon: "mdi:contrast-circle"
    entity_category: config
    min_value: 1.0
    max_value: 3.0
    step: 0.1
    initial_value: 1.1
    optimistic: true
    restore_value: true
    set_action:
      - lambda: id(rainbow_gamma) = x;

  # How long the wake-word "rainbow wipes on around the ring" reveal animation takes.
  - platform: template
    name: "Rainbow Wake Reveal (ms)"
    id: wake_reveal_duration_number
    icon: "mdi:timer-outline"
    entity_category: config
    min_value: 50
    max_value: 1000
    step: 50
    initial_value: 250
    optimistic: true
    restore_value: true
    set_action:
      - lambda: id(wake_reveal_duration_ms) = x;

  # Multiplier applied to Rainbow Speed while listening (reverse direction).
  - platform: template
    name: "Rainbow Reverse Speed x"
    id: rainbow_reverse_multiplier_number
    icon: "mdi:rotate-left"
    entity_category: config
    min_value: 0.5
    max_value: 5.0
    step: 0.5
    initial_value: 2.0
    optimistic: true
    restore_value: true
    set_action:
      - lambda: id(rainbow_reverse_multiplier) = x;

  # Multiplier applied to Rainbow Speed while thinking/processing (forward direction).
  - platform: template
    name: "Rainbow Thinking Speed x"
    id: rainbow_thinking_multiplier_number
    icon: "mdi:rotate-right"
    entity_category: config
    min_value: 0.5
    max_value: 8.0
    step: 0.5
    initial_value: 4.0
    optimistic: true
    restore_value: true
    set_action:
      - lambda: id(rainbow_thinking_multiplier) = x;

script:
  # Master script controlling the LEDs, based on different conditions : initialization in progress, wifi and api connected and voice assistant phase.
  # For the sake of simplicity and re-usability, the script calls child scripts defined below.
  # This script will be called every time one of these conditions is changing.
  - id: control_leds
    then:
      - lambda: |
          id(check_if_timers_active).execute();
          if (id(is_timer_active)){
            id(fetch_first_active_timer).execute();
          }

          // If Rainbow is the user's chosen effect but led_ring is currently off, and
          // something is about to need the display (volume, mute, a timer, a button, the
          // voice assistant, etc.), temporarily turn it on so Rainbow can actually render —
          // its effect only runs while the light is genuinely on. control_leds_voice_assistant_
          // idle_phase below turns it back off once nothing needs it anymore. System/boot
          // states (xmos flashing, improv BLE, init, no HA connection) are intentionally
          // excluded — those use fixed colors regardless of Rainbow and firing this during
          // boot would cause unwanted flashes.
          bool rainbow_overlay_needed =
              id(volume_buttons_touched) ||
              id(btn_action).state ||
              id(jack_plugged_recently) ||
              id(jack_unplugged_recently) ||
              id(warning) ||
              id(timer_ringing).state ||
              (id(voice_assistant_phase) == ${voice_assist_waiting_for_command_phase_id}) ||
              (id(voice_assistant_phase) == ${voice_assist_listening_for_command_phase_id}) ||
              (id(voice_assistant_phase) == ${voice_assist_thinking_phase_id}) ||
              (id(voice_assistant_phase) == ${voice_assist_replying_phase_id}) ||
              (id(voice_assistant_phase) == ${voice_assist_error_phase_id}) ||
              (id(voice_assistant_phase) == ${voice_assist_not_ready_phase_id}) ||
              id(is_timer_active) ||
              id(master_mute_switch).state ||
              id(external_media_player).volume == 0.0f ||
              id(external_media_player).is_muted();
          if (id(rainbow_selected) && rainbow_overlay_needed && !id(led_ring).current_values.get_state()) {
            id(rainbow_temporarily_on) = true;
            auto call = id(led_ring).turn_on();
            call.set_effect("Rainbow");
            call.perform();
          }

          if (id(xmos_flashing_state) > 0) {
            id(control_leds_xmos_flasher_state_update).execute();
          } else if (id(improv_ble_in_progress)) {
            id(control_leds_improv_ble_state).execute();
          } else if (id(init_in_progress)) {
            id(control_leds_init_state).execute();
          } else if (!id(wifi_id).is_connected() || !id(api_id).is_connected()){
            id(control_leds_no_ha_connection_state).execute();
          } else if (id(volume_buttons_touched)) {
            id(control_leds_volume_buttons_touched).execute();
          } else if (id(btn_action).state) {
            id(control_leds_action_button_touched).execute();
          } else if (id(jack_plugged_recently)) {
            id(control_leds_jack_plugged_recently).execute();
          } else if (id(jack_unplugged_recently)) {
            id(control_leds_jack_unplugged_recently).execute();
          } else if (id(warning)) {
            id(control_leds_warning).execute();
          } else if (id(timer_ringing).state) {
            id(control_leds_timer_ringing).execute();
          } else if (id(voice_assistant_phase) == ${voice_assist_waiting_for_command_phase_id}) {
            id(control_leds_voice_assistant_waiting_for_command_phase).execute();
          } else if (id(voice_assistant_phase) == ${voice_assist_listening_for_command_phase_id}) {
            id(control_leds_voice_assistant_listening_for_command_phase).execute();
          } else if (id(voice_assistant_phase) == ${voice_assist_thinking_phase_id}) {
            id(control_leds_voice_assistant_thinking_phase).execute();
          } else if (id(voice_assistant_phase) == ${voice_assist_replying_phase_id}) {
            id(control_leds_voice_assistant_replying_phase).execute();
          } else if (id(voice_assistant_phase) == ${voice_assist_error_phase_id}) {
            id(control_leds_voice_assistant_error_phase).execute();
          } else if (id(voice_assistant_phase) == ${voice_assist_not_ready_phase_id}) {
            id(control_leds_voice_assistant_not_ready_phase).execute();
          } else if (id(is_timer_active)) {
            id(control_leds_timer_ticking).execute();
          } else if (id(master_mute_switch).state) {
            id(control_leds_muted_or_silent).execute();
          } else if (id(external_media_player).volume == 0.0f || id(external_media_player).is_muted()) {
            id(control_leds_muted_or_silent).execute();
          } else if (id(voice_assistant_phase) == ${voice_assist_idle_phase_id}) {
            id(control_leds_voice_assistant_idle_phase).execute();
          }

  # Script executed during Improv BLE
  # Warm White Twinkle
  - id: control_leds_improv_ble_state
    then:
      - light.turn_on:
          brightness: 66%
          red: 100%
          green: 89%
          blue: 71%
          id: voice_assistant_leds
          effect: "Twinkle"

  # Script executed during initialization
  # Blue Twinkle if Wifi is connected, Else solid warm white
  - id: control_leds_init_state
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - light.turn_on:
                brightness: 66%
                red: 9.4%
                green: 73.3%
                blue: 94.9%
                id: voice_assistant_leds
                effect: "Twinkle"
          else:
            - light.turn_on:
                brightness: 33%
                red: 100%
                green: 89%
                blue: 71%
                id: voice_assistant_leds
                effect: "none"

  # Script executed when the device has no connection to Home Assistant
  # Red Twinkle (This will be visible during HA updates for example)
  - id: control_leds_no_ha_connection_state
    then:
      - light.turn_on:
          brightness: 66%
          red: 1
          green: 0
          blue: 0
          id: voice_assistant_leds
          effect: "Twinkle"

  # Script executed when the voice assistant is idle (waiting for a wake word)
  # Nothing (Either LED ring off or LED ring on if the user decided to turn the user facing LED ring on)
  # Rainbow: also resets rainbow_speed back to the slider's baseline value. Without this, if a
  # phase that changes the speed (e.g. Thinking at 2x) is interrupted by an Error or Not Ready
  # state instead of flowing through Replying normally, the speed change is never undone and
  # Rainbow keeps spinning at the leftover speed indefinitely.
  - id: control_leds_voice_assistant_idle_phase
    then:
      - light.turn_off: voice_assistant_leds
      - if:
          condition:
            lambda: 'return id(rainbow_selected) && id(rainbow_temporarily_on);'
          then:
            # We turned led_ring on ourselves just for this interaction (it was off before the
            # wake word) — return it to off now, respecting the user's actual preference.
            - light.turn_off: led_ring
            - lambda: id(rainbow_temporarily_on) = false;
          else:
            - if:
                condition:
                  lambda: 'return id(rainbow_selected);'
                then:
                  - lambda: |-
                      id(rainbow_speed) = id(rainbow_speed_number).state;
            - if:
                condition:
                  light.is_on: led_ring
                then:
                  light.turn_on: led_ring

  # Script executed when the voice assistant is waiting for a command (After the wake word)
  # Single color: original slow clockwise spin, unchanged.
  # Rainbow: all LEDs turn off, then the rainbow wipes back on around the ring (duration set
  # by the "Rainbow Wake Reveal (ms)" number entity) to acknowledge the wake word. If led_ring
  # was off, the centralized wake-up logic at the top of control_leds already turned it back
  # on with Rainbow re-selected before this script runs.
  - id: control_leds_voice_assistant_waiting_for_command_phase
    then:
      - if:
          condition:
            lambda: 'return id(rainbow_selected);'
          then:
            - lambda: |-
                id(rainbow_speed) = 0.f;
                id(wake_reveal_active) = true;
                id(wake_reveal_start_ms) = millis();
          else:
            - lambda: |-
                id(led_anim_speed) = .5f;
            - light.turn_on:
                brightness: !lambda return max( id(led_ring).current_values.get_brightness() , 0.2f );
                id: voice_assistant_leds
                effect: "Rotating Blob"

  # Script executed when the voice assistant is listening to a command
  # Single color: original fast clockwise spin, unchanged.
  # Rainbow: spins in the opposite direction, at the "Rainbow Reverse Speed x" multiplier
  # applied to the Rainbow Speed slider, while it hears you.
  - id: control_leds_voice_assistant_listening_for_command_phase
    then:
      - if:
          condition:
            lambda: 'return id(rainbow_selected);'
          then:
            - lambda: |-
                id(wake_reveal_active) = false;
                id(rainbow_speed) = -id(rainbow_speed_number).state * id(rainbow_reverse_multiplier);
          else:
            - lambda: |-
                id(led_anim_speed) = 1.f;
            - light.turn_on:
                brightness: !lambda return max( id(led_ring).current_values.get_brightness() , 0.2f );
                id: voice_assistant_leds
                effect: "Rotating Blob"

  # Script executed when the voice assistant is thinking about a command
  # Single color: original "Thinking" blink effect, unchanged.
  # Rainbow: spins in the intended (forward) direction at the "Rainbow Thinking Speed x"
  # multiplier applied to the Rainbow Speed slider.
  - id: control_leds_voice_assistant_thinking_phase
    then:
      - if:
          condition:
            lambda: 'return id(rainbow_selected);'
          then:
            - lambda: |-
                id(wake_reveal_active) = false;
                id(rainbow_speed) = id(rainbow_speed_number).state * id(rainbow_thinking_multiplier);
          else:
            - light.turn_on:
                brightness: !lambda return max( id(led_ring).current_values.get_brightness() , 0.2f );
                id: voice_assistant_leds
                effect: "Thinking"

  # Script executed when the voice assistant is replying
  # Single color: original fast anticlockwise spin, unchanged.
  # Rainbow: back to spinning forward at the normal (user-configured) speed during the response.
  - id: control_leds_voice_assistant_replying_phase
    then:
      - if:
          condition:
            lambda: 'return id(rainbow_selected);'
          then:
            - lambda: |-
                id(wake_reveal_active) = false;
                id(rainbow_speed) = id(rainbow_speed_number).state;
          else:
            - lambda: |-
                id(led_anim_speed) = -1.f;
            - light.turn_on:
                brightness: !lambda return max( id(led_ring).current_values.get_brightness() , 0.2f );
                id: voice_assistant_leds
                effect: "Rotating Blob"

  # Script executed when the voice assistant is in error
  # Fast Red Pulse
  - id: control_leds_voice_assistant_error_phase
    then:
      - light.turn_on:
          brightness: !lambda return min ( max( id(led_ring).current_values.get_brightness() , 0.2f ) + 0.1f , 1.0f );
          red: 1
          green: 0
          blue: 0
          id: voice_assistant_leds
          effect: "Error"
      - delay: 2s
      - lambda: id(volume_buttons_touched) = false;
      - script.execute: control_leds

  # Script executed when the voice assistant requires user action
  # 5 Fast Red Pulses
  - id: control_leds_warning
    then:
      - light.turn_on:
          brightness: !lambda return min ( max( id(led_ring).current_values.get_brightness() , 0.2f ) + 0.1f , 1.0f );
          red: 1
          green: 0
          blue: 0
          id: voice_assistant_leds
          effect: "Warning"
      - delay: 2s
      - lambda: id(warning) = false;
      - script.execute: control_leds

  # Script executed when the voice assistant is muted or silent
  # Single color: original behavior, unchanged — LED next to the 2 microphones turn red /
  # one red LED next to the speaker grill, using the "Muted or Silent" effect.
  # Rainbow: do nothing here — the Rainbow effect (still running on led_ring) already draws
  # its own mute indicators every frame, so the rest of the ring keeps cycling normally.
  - id: control_leds_muted_or_silent
    then:
      - if:
          condition:
            lambda: 'return !id(rainbow_selected);'
          then:
            - light.turn_on:
                brightness: !lambda return min ( max( id(led_ring).current_values.get_brightness() , 0.2f ) + 0.1f , 1.0f );
                id: voice_assistant_leds
                effect: "Muted or Silent"
          else:
            - light.turn_off: voice_assistant_leds

  # Script executed when the voice assistant is not ready
  - id: control_leds_voice_assistant_not_ready_phase
    then:
      - light.turn_on:
          brightness: 66%
          red: 1
          green: 0
          blue: 0
          id: voice_assistant_leds
          effect: "Twinkle"

  # Script executed when the volume button is touched
  # A number of LEDs turn on indicating a visual representation of the volume of the media player entity.
  # Single color: original behavior, unchanged.
  # Rainbow: do nothing here — the Rainbow effect (still running on led_ring) already checks
  # volume_buttons_touched itself and draws the proportional volume bar using rainbow colors.
  - id: control_leds_volume_buttons_touched
    then:
      - if:
          condition:
            lambda: 'return !id(rainbow_selected);'
          then:
            - light.turn_on:
                brightness: !lambda return min ( max( id(led_ring).current_values.get_brightness() , 0.2f ) + 0.1f , 1.0f );
                id: voice_assistant_leds
                effect: "Volume Display"
          else:
            - light.turn_off: voice_assistant_leds

  # Script executed when the jack has just been unplugged
  # A ripple effect
  - id: control_leds_jack_unplugged_recently
    then:
      - light.turn_on:
          brightness: !lambda return min ( max( id(led_ring).current_values.get_brightness() , 0.2f ) + 0.1f , 1.0f );
          id: voice_assistant_leds
          effect: "Jack Unplugged"

  # Script executed when the jack has just been plugged
  # A ripple effect
  - id: control_leds_jack_plugged_recently
    then:
      - light.turn_on:
          brightness: !lambda return max( id(led_ring).current_values.get_brightness() , 0.2f );
          id: voice_assistant_leds
          effect: "Jack Plugged"

  # Script executed when the center button is touched
  # The complete LED ring turns on
  - id: control_leds_action_button_touched
    then:
      - light.turn_on:
          brightness: !lambda return min ( max( id(led_ring).current_values.get_brightness() , 0.2f ) + 0.1f , 1.0f );
          id: voice_assistant_leds
          effect: "Action Button Touched"

  # Script executed when the timer is ringing, to control the LEDs
  # The LED ring blinks.
  - id: control_leds_timer_ringing
    then:
      - light.turn_on:
          brightness: !lambda return min ( max( id(led_ring).current_values.get_brightness() , 0.2f ) + 0.1f , 1.0f );
          id: voice_assistant_leds
          effect: "Timer Ring"

  # Script executed when the timer is ticking, to control the LEDs
  # The LEDs shows the remaining time as a fraction of the full ring.
  # Single color: original behavior, unchanged.
  # Rainbow: do nothing here — the Rainbow effect (still running on led_ring) already checks
  # is_timer_active itself and draws the same fading countdown edge using rainbow colors.
  - id: control_leds_timer_ticking
    then:
      - if:
          condition:
            lambda: 'return !id(rainbow_selected);'
          then:
            - light.turn_on:
                brightness: !lambda return min ( max( id(led_ring).current_values.get_brightness() , 0.2f ) + 0.1f , 1.0f );
                id: voice_assistant_leds
                effect: "Timer tick"
          else:
            - light.turn_off: voice_assistant_leds

  # Script executed when the timer is ticking, to control the LEDs
  # The LEDs shows the remaining time as a fraction of the full ring.
  - id: control_leds_xmos_flasher_state_update
    then:
      - if:
          condition:
            lambda: 'return id(xmos_flashing_state) == 1;'
          then:
            - light.turn_on:
                brightness: !lambda return .6f ;
                id: voice_assistant_leds
                effect: "Flashing XMOS"
          else:
            - light.turn_on:
                brightness: !lambda return .6f ;
                id: voice_assistant_leds
                effect: !lambda 'return id(xmos_flashing_state) == 3 ? "Error" : "Success" ;'
            - delay: 1s
            - light.turn_off:
                id: voice_assistant_leds
